@if (loading()) {
  <div class="card loading" role="status" aria-live="polite">
    <span class="sr-only">Loading employee</span>
    <div class="skeleton-avatar"></div>
    <div class="skeleton-lines">
      <div class="skeleton-bar skeleton-bar--wide"></div>
      <div class="skeleton-bar"></div>
    </div>
  </div>
} @else if (notFound()) {
  <app-empty-state
    icon="person_off"
    title="Employee not found"
    message="The employee may have been deleted or the link is wrong."
  >
    <a mat-stroked-button routerLink="/employees">Back to employees</a>
  </app-empty-state>
} @else if (employee(); as e) {
  <app-employee-header [employee]="e" />

  <mat-tab-group
    class="tabs"
    animationDuration="0ms"
    mat-stretch-tabs="false"
    mat-align-tabs="start"
    [selectedIndex]="tabIndex()"
    (selectedIndexChange)="selectTab($event)"
  >
    <mat-tab label="Overview">
      <div class="tab-body">
        <app-employee-overview [employee]="e" />
      </div>
    </mat-tab>
    <mat-tab>
      <ng-template mat-tab-label>
        Documents <span class="count">{{ e.documents.length }}</span>
      </ng-template>
      <div class="tab-body">
        <app-employee-documents [documents]="e.documents" />
      </div>
    </mat-tab>
    <mat-tab label="Activity">
      <div class="tab-body">
        <app-employee-activity [events]="e.activity" />
      </div>
    </mat-tab>
  </mat-tab-group>
}
